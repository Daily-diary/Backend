spring.application.name=daily-diary

spring.datasource.url=jdbc:h2:mem:daily-diary;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

firebase.service-account.path=./firebase-config.json
firebase.project-id=daily-diary-89757
